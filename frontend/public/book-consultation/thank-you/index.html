<style>
:root{--blue:#0B8BAB;--blue-deeper:#054D62;--orange:#F5A623;--orange-dark:#D4891A;--navy:#0D1B2A;--navy-mid:#1A2E42}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(135deg,var(--navy),var(--blue-deeper));color:#dcebf2;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;overflow-x:hidden}
.card{max-width:560px;width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:clamp(28px,6vw,48px);backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.tick{width:96px;height:96px;border-radius:50%;background:#27AE60;display:grid;place-items:center;margin:0 auto 22px;animation:pop .5s cubic-bezier(.22,1,.36,1)}
.tick svg{width:48px;height:48px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .25s forwards ease}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
h1{font-family:'Poppins',sans-serif;color:#fff;font-size:clamp(1.7rem,5vw,2.5rem);margin-bottom:12px}
.lead{color:#b9cedb;font-size:clamp(1rem,2.2vw,1.15rem);margin-bottom:8px}
.time{display:inline-flex;align-items:center;gap:8px;background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.3);color:var(--orange);font-weight:700;padding:10px 18px;border-radius:999px;font-size:14px;margin:16px 0 26px}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-family:'Poppins',sans-serif;border-radius:14px;padding:16px 30px;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn-orange{background:var(--orange);color:var(--navy);box-shadow:0 12px 28px rgba(245,166,35,.35)}
.btn-orange:hover{background:var(--orange-dark);color:#fff}
.btn-line{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3)}
.btn-line:hover{background:rgba(255,255,255,.08)}
.note{margin-top:24px;font-size:13px;color:#8fa9b8}
.note a{color:var(--orange);font-weight:700;text-decoration:none}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
